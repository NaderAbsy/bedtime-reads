name: Build tonight's page

on:
  schedule:
    # GitHub often starts scheduled runs late, worst on the hour (we've seen 3-7 hours), so the build is
    # scheduled at odd minutes in the afternoon, with a backup run. Times are UTC; Amman is UTC+3.
    # A second run on the same evening keeps the stories the first one chose.
    - cron: "23 12 * * *"   # 15:23 Amman
    - cron: "53 14 * * *"   # 17:53 Amman, backup
  workflow_dispatch: {}   # adds a "Run workflow" button for a manual refresh

permissions:
  contents: write   # to save the built page back to the repo
  pages: write
  id-token: write
  issues: write     # to open an issue (which emails you) when a source stops working

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Skyfield works out tonight's sky; its planet-position file (~17 MB) is cached between runs.
      - name: Install the astronomy library
        run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .skyfield
          key: skyfield-de421

      - name: Fetch feeds and build the page
        run: python build.py

      # Saves tonight's page, the archive and the "already shown" history (so tomorrow
      # leads with new stories). It also counts as repo activity, which stops GitHub
      # from pausing this daily schedule after 60 quiet days.
      - name: Save the built page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site data
          git diff --cached --quiet || git commit -m "Tonight's reads: $(TZ=Asia/Amman date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # If a source has failed 3 nights running (or gone quiet for a month), open an issue on the
      # repository; GitHub emails the owner. The issue is updated while problems last and closed
      # automatically once every source works again.
      - name: Report sources that need attention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Some reading sources need attention"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -f data/source_problems.md ]; then
            { echo "@${{ github.repository_owner }}"; echo; cat data/source_problems.md; } > /tmp/body.md
            if [ -n "$open" ]; then gh issue edit "$open" --body-file /tmp/body.md
            else gh issue create --title "$title" --body-file /tmp/body.md; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "All sources are working again."
          fi
