name: Build tonight's page

on:
  schedule:
    # Every day at 15:00 UTC = 18:00 in Amman, ready well before bedtime.
    # GitHub can start scheduled runs up to ~30 minutes late; that's normal.
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for a manual refresh

permissions:
  contents: write   # to save the built page back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and build the page
        run: python build.py

      # Saving the page also counts as repo activity, which stops GitHub
      # from pausing this daily schedule after 60 quiet days.
      - name: Save the built page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "Tonight's reads: $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
