<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#14110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bedtime">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --size: 20px;
    --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
    --sans: -apple-system, system-ui, "Helvetica Neue", sans-serif;
    /* Night (default): warm, low-contrast, no pure white anywhere. */
    --bg: #14110e; --bg-raised: #1c1814; --ink: #e6dac6; --ink-soft: #a89a85;
    --ink-faint: #74685a; --rule: #2e2721; --accent: #d9a35f; --visited: #8a7d6b;
    --img-filter: brightness(.82) saturate(.85);
    color-scheme: dark;
  }
  /* Paper: sepia for reading with a lamp on. Chosen with the in-page button only. */
  :root[data-mood="paper"] {
    color-scheme: light;
    --bg: #f3ead8; --bg-raised: #ece1cb; --ink: #3a2f24; --ink-soft: #6b5c4b;
    --ink-faint: #94846f; --rule: #dccfb6; --accent: #9a5b1e; --visited: #8f8070;
    --img-filter: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: var(--size)/1.6 var(--serif);
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    transition: background .3s, color .3s;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 28px; }

  /* Header */
  header { padding: 40px 0 8px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .date { font: 600 13px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
  h1 { font-size: 2.1em; line-height: 1.1; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .greeting { color: var(--ink-soft); margin: 8px 0 0; font-style: italic; }
  .controls { display: flex; gap: 8px; flex-shrink: 0; padding-top: 2px; }
  .controls button {
    font: 600 15px/1 var(--sans); color: var(--ink-soft); background: var(--bg-raised);
    border: 1px solid var(--rule); border-radius: 22px; min-width: 44px; height: 44px; padding: 0 14px; cursor: pointer;
  }
  .controls button:active { transform: scale(.96); }
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 26px 0 0; padding-bottom: 22px; border-bottom: 1px solid var(--rule); }
  nav a {
    font: 500 15px/1 var(--sans); color: var(--ink-soft); padding: 11px 16px;
    border: 1px solid var(--rule); border-radius: 22px;
  }

  /* Picture of the day */
  .potd { margin: 30px 0 10px; }
  .potd img {
    display: block; width: 100%; max-height: 62vh; object-fit: cover; border-radius: 14px;
    background: var(--bg-raised); filter: var(--img-filter);
  }
  .potd-text { padding: 18px 2px 0; }
  .eyebrow { font: 600 12px/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .potd h2 { font-size: 1.35em; line-height: 1.25; margin: 8px 0 6px; font-weight: 600; }
  .potd p { margin: 0; color: var(--ink-soft); font-size: .92em; }

  /* Sections */
  .section { padding-top: 34px; scroll-margin-top: 12px; }
  .section-title {
    font: 600 13px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
    margin: 0 0 6px; display: flex; align-items: center; gap: 14px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

  .story { border-bottom: 1px solid var(--rule); }
  .story:last-child { border-bottom: 0; }
  .story > a { display: flex; gap: 20px; padding: 22px 0; align-items: flex-start; }
  .story .thumb { flex: 0 0 150px; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: var(--bg-raised); }
  .story .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; filter: var(--img-filter); }
  .story .text { flex: 1; min-width: 0; }
  .story h3 { font-size: 1.12em; line-height: 1.3; font-weight: 600; margin: 6px 0 6px; }
  .story p { margin: 0; color: var(--ink-soft); font-size: .88em; line-height: 1.55; }
  .story a:visited h3 { color: var(--visited); }

  .story.lead > a { flex-direction: column; gap: 14px; }
  .story.lead .thumb { flex: none; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; }
  .story.lead h3 { font-size: 1.32em; }

  .meta { font: 500 13px/1.3 var(--sans); color: var(--ink-faint); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .meta .source { color: var(--ink-soft); font-weight: 600; }
  .meta time:not(:empty)::before { content: "·"; margin-right: 10px; }
  .badge {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
    border: 1px solid currentColor; border-radius: 4px; padding: 2px 6px; opacity: .85;
  }

  footer { padding: 46px 0 70px; text-align: center; color: var(--ink-faint); font-size: .8em; }
  footer .goodnight { font-style: italic; font-size: 1.25em; color: var(--ink-soft); margin: 0 0 14px; }
  footer .small { font: 13px/1.6 var(--sans); }

  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    h1 { font-size: 1.7em; }
    .story .thumb { flex-basis: 96px; }
    .story > a { gap: 14px; }
  }
</style>
<script>
  // Apply saved preferences before paint, so there is no bright flash at night.
  try {
    if (localStorage.getItem("br-theme") === "paper") document.documentElement.dataset.mood = "paper";
    var s = localStorage.getItem("br-size"); if (s) document.documentElement.style.setProperty("--size", s + "px");
  } catch (e) {}
</script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="top">
        <div>
          <p class="date" id="date">Tonight</p>
          <h1>{{TITLE}}</h1>
          <p class="greeting" id="greeting">A few good things to read before sleep.</p>
        </div>
        <div class="controls">
          <button id="smaller" aria-label="Smaller text">A−</button>
          <button id="bigger" aria-label="Bigger text">A+</button>
          <button id="theme" aria-label="Switch between night and paper colours">☾</button>
        </div>
      </div>
      <nav>{{NAV}}</nav>
    </header>

    <main>{{HERO}}{{SECTIONS}}
    </main>

    <footer>
      <p class="goodnight">That’s all for tonight. Sleep well.</p>
      <p class="small">Fresh stories every day · <span id="built" data-built="{{BUILT}}"></span></p>
      <p class="small">From {{SOURCES}}</p>
    </footer>
  </div>

<script>
(function () {
  var root = document.documentElement;
  var now = new Date();

  document.getElementById("date").textContent =
    now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  var h = now.getHours();
  document.getElementById("greeting").textContent =
    h >= 18 || h < 4 ? "Good evening. A few good things to read before sleep."
                     : "A few good things to read before sleep.";

  // "Today", "Yesterday", "3 days ago" next to each story.
  var day = 864e5, midnight = new Date(now).setHours(0, 0, 0, 0);
  document.querySelectorAll("time[datetime]").forEach(function (el) {
    var d = new Date(el.getAttribute("datetime"));
    if (isNaN(d)) return;
    var diff = Math.floor((midnight - new Date(d).setHours(0, 0, 0, 0)) / day);
    el.textContent = diff <= 0 ? "Today" : diff === 1 ? "Yesterday" : diff + " days ago";
  });

  var b = document.getElementById("built"), bd = new Date(b.dataset.built);
  if (!isNaN(bd)) b.textContent = "updated " + bd.toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });

  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var themeBtn = document.getElementById("theme");
  function isPaper() { return root.dataset.mood === "paper"; }
  function syncThemeBtn() {
    themeBtn.textContent = isPaper() ? "☀︎" : "☾";
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = isPaper() ? "#f3ead8" : "#14110e";
  }
  syncThemeBtn();
  themeBtn.onclick = function () {
    if (isPaper()) delete root.dataset.mood; else root.dataset.mood = "paper";
    save("br-theme", isPaper() ? "paper" : "night"); syncThemeBtn();
  };

  function size() { return parseFloat(getComputedStyle(root).getPropertyValue("--size")) || 20; }
  function setSize(px) { px = Math.max(16, Math.min(28, px)); root.style.setProperty("--size", px + "px"); save("br-size", px); }
  document.getElementById("smaller").onclick = function () { setSize(size() - 2); };
  document.getElementById("bigger").onclick = function () { setSize(size() + 2); };
})();
</script>
</body>
</html>
